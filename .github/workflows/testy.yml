name: Testy kalkulatora

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Przypięte zależności testowe
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Testy bez sieci
        run: |
          python -m ruff check .
          python -m pytest -q
          pnpm test
          node --check formularz.js
          node --check silnik.js
          bash -n start.sh work_now.sh
      - name: Dane strony są zgodne z CSV
        run: |
          python eksportuj_dane.py --sprawdz
          PYTHON=python bash start.sh --tylko-eksport
          git diff --exit-code -- dane_rdn.js
