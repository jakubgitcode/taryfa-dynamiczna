name: Miesięczna aktualizacja cen TGE RDN

on:
  schedule:
    # 1. dnia miesiąca, 06:17 UTC — ceny na ostatni dzień poprzedniego miesiąca są znane od sesji dzień wcześniej
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      miesiac:
        description: "Miesiąc (1-12); puste razem z rokiem = poprzedni miesiąc"
        required: false
      rok:
        description: "Rok, np. 2026"
        required: false

permissions:
  contents: write

concurrency:
  group: aktualizuj-dane
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Pobranie danych, walidacja, heatmapy
        env:
          PYTHON: python
          MIESIAC: ${{ inputs.miesiac }}
          ROK: ${{ inputs.rok }}
        run: |
          if [ -n "$MIESIAC$ROK" ]; then
            bash ./start.sh "$MIESIAC" "$ROK"
          else
            bash ./start.sh
          fi

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tge_rdn_hourly_*.csv tge_rdn_heatmap_*.png
          if git diff --cached --quiet; then
            echo "Brak zmian w danych"
            exit 0
          fi
          miesiace=$(git diff --cached --name-only | grep -oE '20[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' ' ')
          git commit -m "Dane TGE RDN: ${miesiace:-aktualizacja}"
          git push
